<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jérémie KOMOE | Portfolio</title>
  <meta name="description" content="Portfolio de Jérémie KOMOE — QA Tester passionné par l'automatisation, les tests logiciels et les technologies web.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-foreground: #ffffff;
      --accent: #dbeafe;
      --background: #fafafa;
      --foreground: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --card: rgba(255, 255, 255, 0.8);
      --shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.3);
      --shadow-hover: 0 14px 40px -10px rgba(37, 99, 235, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      cursor: pointer;
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(37, 99, 235, 0.12) 1px, transparent 0);
      background-size: 2.5rem 2.5rem;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      opacity: 0.6;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.5;
    }

    .orb-1 {
      width: 18rem;
      height: 18rem;
      top: 20%;
      left: -4rem;
      background: rgba(37, 99, 235, 0.15);
      animation: float 6s ease-in-out infinite;
    }

    .orb-2 {
      width: 24rem;
      height: 24rem;
      bottom: 15%;
      right: -6rem;
      background: rgba(219, 234, 254, 0.8);
      animation: float 8s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 16rem;
      height: 16rem;
      top: 50%;
      left: 35%;
      background: rgba(37, 99, 235, 0.08);
      animation: pulse 4s ease-in-out infinite;
    }

    .decor-icon {
      position: absolute;
      opacity: 0.15;
      color: var(--primary);
      pointer-events: none;
    }

    .icon-cpu {
      top: 12%;
      right: 8%;
      width: 6rem;
      height: 6rem;
      animation: float 8s ease-in-out infinite;
    }

    .icon-code {
      bottom: 12%;
      left: 6%;
      width: 5rem;
      height: 5rem;
      animation: float 6s ease-in-out infinite reverse;
    }

    .content {
      position: relative;
      z-index: 10;
      max-width: 48rem;
      text-align: center;
      padding: 1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .dot {
      position: relative;
      display: inline-flex;
      width: 0.625rem;
      height: 0.625rem;
    }

    .dot::before,
    .dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--primary);
    }

    .dot::before {
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      opacity: 0.75;
    }

    .badge-text {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .title {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 42rem;
      margin: 0 auto 2rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 1rem;
      font-weight: 600;
      padding: 1rem 2rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    .cta:hover {
      transform: scale(1.05);
      background: var(--primary-hover);
      box-shadow: var(--shadow-hover);
    }

    .cta:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .cta svg {
      width: 1.25rem;
      height: 1.25rem;
      transition: transform 0.3s ease;
    }

    .cta:hover svg {
      transform: translateX(4px);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2.5rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }

    .tag {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    .tag:hover {
      border-color: rgba(37, 99, 235, 0.3);
      color: var(--foreground);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(1.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-1.5rem) translateX(0.5rem); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.65; }
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    @media (max-width: 640px) {
      .decor-icon { display: none; }
      .cta { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="tech-grid" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <svg class="decor-icon icon-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="4" y="4" width="16" height="16" rx="2"></rect>
      <rect x="9" y="9" width="6" height="6"></rect>
      <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"></path>
    </svg>
    <svg class="decor-icon icon-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <polyline points="16 18 22 12 16 6"></polyline>
      <polyline points="8 6 2 12 8 18"></polyline>
    </svg>

    <div class="content">
      <div class="badge">
        <span class="dot" aria-hidden="true"></span>
        <span class="badge-text">Jérémie KOMOE</span>
      </div>
      <h1 class="title">Bienvenue sur mon portfolio</h1>
      <p class="subtitle">QA Tester et passionné par l'automatisation, les tests logiciels et les technologies web.</p>
      <button type="button" class="cta">
        Voir mes projets
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
      <div class="tags">
        <span class="tag">Automatisation</span>
        <span class="tag">Tests logiciels</span>
        <span class="tag">Technologies web</span>
      </div>
    </div>
  </main>
</body>
</html>
